# 运行配置模板：复制为 config.yaml 后按需修改（config.yaml 已被 git 忽略）。
# 也可通过环境变量 QUAN_WORD_CONFIG 指定其他配置路径；缺省读 ./config.yaml，
# 文件不存在时使用内建默认（sqlite + 0.0.0.0:3000）。
server:
  host: "0.0.0.0"
  port: 3000
  # 访问密钥：设置后所有 /api 请求必须携带 Authorization: Bearer <密钥>（或 X-Api-Key 头），未设置则不启用
  # auth_key: "change-me"
database:
  url: "sqlite://./data/quan_word.db?mode=rwc"
# 切换 PostgreSQL 时改为：
# database:
#   url: "postgres://postgres:postgres@localhost:5432/quan_word"
# 批量导入（可选，缺省用下列值）
import:
  max_rows: 5000            # 单次导入数据行数上限（不含表头）
  cache_ttl_secs: 1800      # 预览会话有效期（秒）：超时未导入自动清理
  cache_cap: 16             # 预览会话缓存上限（条）：超出整体清空
  cache_cleanup_secs: 60    # 后台清理任务扫描间隔（秒）
# 词典抓词（可选，缺省用下列值）：/api/dict/providers、/api/dict/plugins、/api/dict/lookup
dict:
  enabled: true
  # 默认启用的词典源（顺序即聚合结果顺序）；空 = 全部已安装插件。
  # 设置页的运行时启停会覆盖这里，并持久化到 plugins_dir/.state.json。
  # 示例包在 examples/plugins/，从设置页「导入插件」手动装载。
  providers: []
  # 插件目录：运行时读取 *.json；目录为空也可启动，之后从设置页导入
  plugins_dir: "./data/plugins"
  # 目录轮询间隔（秒）：0 = 关闭自动发现；默认 5 秒，新增/删除插件文件后自动重载
  plugins_poll_secs: 5
  max_plugins: 32             # 插件数量上限（1..=256）
  timeout_ms: 6000            # 单次上游请求超时（毫秒，500..=30000）
  cache_ttl_secs: 604800      # 正向结果缓存（秒）
  negative_ttl_secs: 600      # 未收录结果缓存（秒）
  cache_cap: 2048             # 缓存条目上限
  cache_cleanup_secs: 300     # 后台清理任务扫描间隔（秒）
  max_concurrency: 8          # 同时进行中的上游请求上限
  breaker_threshold: 3        # 连续失败多少次熔断该源
  breaker_cooldown_secs: 60   # 熔断冷却时长（秒）
  max_word_len: 64            # 单词最大字符数（1..=128）
