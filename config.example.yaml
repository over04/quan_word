# 运行配置模板：复制为 config.yaml 后按需修改（config.yaml 已被 git 忽略）。
# 也可通过环境变量 QUAN_WORD_CONFIG 指定其他配置路径；缺省读 ./config.yaml，
# 文件不存在时使用内建默认（sqlite + 0.0.0.0:3000）。
server:
  host: "0.0.0.0"
  port: 3000
  # 访问密钥：设置后所有 /api 请求必须携带 Authorization: Bearer <密钥>（或 X-Api-Key 头），未设置则不启用
  # auth_key: "change-me"
database:
  url: "sqlite://./data/quan_word.db?mode=rwc"
# 切换 PostgreSQL 时改为：
# database:
#   url: "postgres://postgres:postgres@localhost:5432/quan_word"
